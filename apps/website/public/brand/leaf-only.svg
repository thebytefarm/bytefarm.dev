<svg width="160" height="140" viewBox="20 20 160 140" fill="none" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <!-- Symmetric pixel leaf, pointing up, body in light green -->
  <rect x="80" y="20" width="40" height="20" fill="#9ECF00"/>
  <rect x="60" y="40" width="80" height="20" fill="#9ECF00"/>
  <rect x="40" y="60" width="120" height="20" fill="#9ECF00"/>
  <rect x="20" y="80" width="160" height="20" fill="#9ECF00"/>
  <rect x="40" y="100" width="120" height="20" fill="#9ECF00"/>
  <rect x="60" y="120" width="80" height="20" fill="#9ECF00"/>
  <rect x="80" y="140" width="40" height="20" fill="#9ECF00"/>

  <!-- Dark left-side outline for depth -->
  <rect x="80" y="20" width="20" height="20" fill="#3A4C00"/>
  <rect x="60" y="40" width="20" height="20" fill="#3A4C00"/>
  <rect x="40" y="60" width="20" height="20" fill="#3A4C00"/>
  <rect x="20" y="80" width="20" height="20" fill="#3A4C00"/>
  <rect x="40" y="100" width="20" height="20" fill="#3A4C00"/>
  <rect x="60" y="120" width="20" height="20" fill="#3A4C00"/>

  <!-- Central vein dots -->
  <rect x="90" y="40" width="20" height="10" fill="#3A4C00"/>
  <rect x="90" y="70" width="20" height="10" fill="#3A4C00"/>
  <rect x="90" y="100" width="20" height="10" fill="#3A4C00"/>
  <rect x="90" y="130" width="20" height="10" fill="#3A4C00"/>
</svg>
